<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 5 Exercises</title>
  </head>
  <body>
    <script>
      // 5a. & 5b. Name variable & Display 
      const name = "Dilanka Shashini";
      console.log(`My name is: ${name}`);
      
      // 5c. & 5d. Restaurant cost (1 coffee $5, 2 bagels $3 each, 1 soup $9)
      const coffee = 5;
      const bagels = 3;
      const soup = 9;
      const cost = coffee + 2*bagels + soup;
      console.log(`Cost of food: $${cost}`);

      // 5e. & 5f. Tax calculation (10%)
      const tax = cost *  0.1;
      console.log(`Tax (10%): $${tax}`);

      // 5g. Total Cost (cost + tax)
      const totalCost = cost + tax;
      console.log(`Total cost: $${totalCost}`);
    </script>
  </body>
</html>
