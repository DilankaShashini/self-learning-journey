<!DOCTYPE html>
<html>
  <head>
    <title>Arrays and Loops Practice</title>
  </head>
  <body>
    <script>
      // ==========================================
      // Array Basics & Loop Operations
      // ==========================================
      const myArray = [10, 20, 30];
      console.log('Original Array:', myArray);
      console.log('Element at Index 1:', myArray[1]); // 20

      myArray[1] = 99; // Reassign element
      console.log('Modified Array:', myArray); // [10, 99, 30]

      console.log('Type of Array:', typeof myArray); // 'object'
      console.log('Is Array check:', Array.isArray(myArray)); // true
      console.log('Array Length:', myArray.length); // 3

      myArray.push(100); // Add to end
      console.log('After push:', myArray); // [10, 99, 30, 100]

      myArray.splice(0, 1); // Remove 1 item starting at index 0
      console.log('After splice(0, 1):', myArray); // [99, 30, 100]

      // ==========================================
      // Arrays are References
      // ==========================================
      const array1 = [1, 2, 3];
      const array2 = array1; // Reference copy
      array2.push(4);
      console.log('array1 (mutated by array2):', array1); // [1, 2, 3, 4]
      console.log('array2:', array2); // [1, 2, 3, 4]

      // True Copy using .slice()
      const array3 = array1.slice();
      array3.push(5);
      console.log('array1 after array3 slice push:', array1); // [1, 2, 3, 4]
      console.log('array3 (independent copy):', array3); // [1, 2, 3, 4, 5]

      // ==========================================
      // Destructuring
      // ==========================================
      const [firstValue, secondValue] = [10, 20, 30];
      console.log('Destructuring Array:', firstValue, secondValue); // 10, 20

      // ==========================================
      // break & continue
      // ==========================================
      console.log('--- Break at 8 ---');
      for (let i = 1; i <= 10; i++) {
        console.log(i);
        if (i === 8) {
          break; // Exits loop at 8
        }
      }

      console.log('--- Continue (Skip multiples of 3) ---');
      for (let i = 1; i <= 10; i++) {
        if (i % 3 === 0) {
          continue; // Skips 3, 6, 9
        }
        console.log(i);
        if (i === 8) {
          break;
        }
      }

      console.log('--- While Loop with continue ---');
      let w = 1;
      while (w <= 10) {
        if (w % 3 === 0) {
          w++; // Manual increment before continue prevents infinite loop
          continue;
        }
        console.log(w);
        w++;
      }

      // Function Early Exit with Return
      function doubleArray(nums) {
        const numsDoubled = [];
        for (let i = 0; i < nums.length; i++) {
          const num = nums[i];
          if (num === 0) {
            return numsDoubled; // Exits early when 0 is encountered
          }
          numsDoubled.push(num * 2);
        }
        return numsDoubled;
      }
      console.log('doubleArray([1, 1, 3]):', doubleArray([1, 1, 3])); // [2, 2, 6]
      console.log('doubleArray([2, 4, 0, 8]):', doubleArray([2, 4, 0, 8])); // [4, 8]
    </script>
  </body>
</html>
