<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors (DOM Version)</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>

    <!-- Player Move Buttons -->
    <button onclick="playGame('rock');">Rock</button>
    <button onclick="playGame('paper');">Paper</button>
    <button onclick="playGame('scissors');">Scissors</button>

    <!-- Dynamic DOM Display Paragraphs -->
    <p class="js-result"></p>
    <p class="js-moves"></p>
    <p class="js-score"></p>

    <!-- Reset Score Button -->
    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      
      localStorage.removeItem('score');
      updateScoreElement();
      
      // Clear outcome displays upon score reset
      document.querySelector('.js-result').innerHTML = '';
      document.querySelector('.js-moves').innerHTML = '';
    ">
      Reset Score
    </button>

    <script>
      // Load saved score from localStorage using default value pattern (|| operator)
      let score = JSON.parse(localStorage.getItem('score')) || {
        wins: 0,
        losses: 0,
        ties: 0
      };

      // Initial score rendering when the page loads
      updateScoreElement();

      // Main Game Logic Function
      function playGame(playerMove) {
        const computerMove = pickComputerMove();
        let result = '';

        if (playerMove === 'scissors') {
          if (computerMove === 'rock') {
            result = 'You lose.';
          } else if (computerMove === 'paper') {
            result = 'You win.';
          } else if (computerMove === 'scissors') {
            result = 'Tie.';
          }
        } else if (playerMove === 'rock') {
          if (computerMove === 'rock') {
            result = 'Tie.';
          } else if (computerMove === 'paper') {
            result = 'You lose.';
          } else if (computerMove === 'scissors') {
            result = 'You win.';
          }
        } else if (playerMove === 'paper') {
          if (computerMove === 'rock') {
            result = 'You win.';
          } else if (computerMove === 'paper') {
            result = 'Tie.';
          } else if (computerMove === 'scissors') {
            result = 'You lose.';
          }
        }

        // Update score object counts
        if (result === 'You win.') {
          score.wins += 1;
        } else if (result === 'You lose.') {
          score.losses += 1;
        } else if (result === 'Tie.') {
          score.ties += 1;
        }

        // Save score object to localStorage as a JSON string
        localStorage.setItem('score', JSON.stringify(score));

        // Update score display in DOM
        updateScoreElement();

        // Render game result and selected moves directly in webpage elements
        document.querySelector('.js-result').innerHTML = result;
        document.querySelector('.js-moves').innerHTML = `You ${playerMove} - ${computerMove} Computer`;
      }

      // Helper function to update score element text
      function updateScoreElement() {
        document.querySelector('.js-score')
          .innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
      }

      // Helper function to pick computer move randomly
      function pickComputerMove() {
        const randomNumber = Math.random();
        let computerMove = '';

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'rock';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'paper';
        } else {
          computerMove = 'scissors';
        }

        return computerMove;
      }
    </script>
  </body>
</html>
