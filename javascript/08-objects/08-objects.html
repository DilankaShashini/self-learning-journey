<!DOCTYPE html>
<html>
  <head>
    <title>Objects Practice</title>
  </head>
  <body>
    <script>
      // 1. Basic Object & Dot/Bracket Notation
      const product = {
        name: 'socks',
        price: 1090
      };
      console.log(product.name);              // socks
      product.name = 'cotton-socks';

      // 2. Bracket Notation for Hyphenated Keys & Variables
      const product2 = {
        name: 'shirt',
        'delivery-time': '1 day',             // ['delivery-time']: '1 day'
        rating: {
          stars: 4.5,
          count: 87
        },
        fun: function function1(){
          console.log('function inside object');
        }
      };
      
      console.log(product2['delivery-time']); // '1 day'
      console.log(product2.rating.stars);     // 4.5
      product2.fun();                         // 'function inside object'

      // 3. Built-in JSON Operations
      const jsonString = JSON.stringify(product2);
      console.log(jsonString);                 // {"name":"shirt","delivery-time":"1 day", "rating":{"stars":4.5,"count":87}}
      console.log(JSON.parse(jsonString));     // Back to JS Object
      
      // 4. Auto-Boxing Examples
      console.log('hello'.length);              // 5
      console.log('hello'.toUpperCase());       // 'HELLO'

      // 5. Objects are References
      const object1 = { message: 'hello' };
      const object2 = object1;                  // Copies reference

      object1.message = 'Good job!';
      console.log(object2.message);             // 'Good job!'

      // 6. Object Shortcuts (Destructuring & Shorthands)
      const object4 = { message: 'Good job!', price: 799 };
      const { message, price } = object4        // Destructuring

      const shorthandObj = {
        message,                                // Shorthand Property
        method(){                               // Shorthand Method
          console.log('Shorthand method called')
        }
      };
      shorthandObj.method();                 // 'Shorthand method called'
    </script>
  </body>
</html>
