<!DOCTYPE html>
<html>
  <head>
    <title>Todo List - Advanced Functions</title>
    <link rel="stylesheet" href="styles/12-todo-list.css">
  </head>
  <body>
    <p>Todo List</p>

    <!-- CSS Grid Input Row -->
    <div class="todo-input-grid">
      <input 
        placeholder="Todo name"
        class="js-input-name input-name"
      >
      <input
        type="date"
        class="js-input-date input-date"
      >
      <button class="js-add-button add-button">
        Add
      </button>
    </div>

    <!-- Dynamic CSS Grid Container -->
    <div class="js-todo-list todo-list"></div>

    <script src="scripts/12-todo-list.js"></script>
  </body>
</html>
