<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity (Functions & Early Return)</title>
  </head>
  <body>
    <!-- Display Cart Quantity -->
    <button onclick="console.log(`Cart Quantity: ${cartQuantity}`);">
      Show Quantity
    </button>

    <br><br>

    <!-- Quantity Modifiers -->
    <!-- Increase Buttons with Max Limit Check -->
    <button onclick="updateCartQuantity(1);">Add to Cart</button>
    <button onclick="updateCartQuantity(2);">+2</button>
    <button onclick="updateCartQuantity(3);">+3</button>
    <button onclick="updateCartQuantity(4);">+4</button>
    <button onclick="updateCartQuantity(5);">+5</button>

    <br><br>

    <!-- Decrease Buttons with Minimum Limit Check -->
    <button onclick="updateCartQuantity(-1);">Remove from cart</button>
    <button onclick="updateCartQuantity(-2);">-2</button>
    <button onclick="updateCartQuantity(-3);">-3</button>

    <br><br>

    <!-- Reset Cart -->
    <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset');
      console.log(`Cart Quantity: ${cartQuantity}`);
    ">
      Reset Cart
    </button> 

    <script>
      let cartQuantity = 0;

      // 7k & 7l: Refactored Handler using Early Returns to eliminate nested else-if structures
      function updateCartQuantity(change){
        if (cartQuantity + change > 10) {
          alert('The cart is full');
          return; // Early return prevents execution of further code
        }
          
        if (cartQuantity + change < 0){
          alert('Not enough items in the cart');
          return; // Early return prevents execution of further code
        }
          
        cartQuantity += change;
        console.log(`Cart Quantity: ${cartQuantity}`);
      }
    </script>
  </body>
</html>
