<!DOCTYPE html>
<html>
  <head>
    <title>HTML CSS Reviw Practice</title>
    <style>
      .red-button {
        background-color: red;
        color: white;
        border: none;
      }
      .yellow-button {
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <!-- HTML Element with Attributes and Inline Event Handler -->
    <button title="Good Job!" class="reb-button" onclick="alert('Good Job!');">
      hello
    </button>
    
    <button class="yellow-button" onclick="console.log('Yellow button clicked');">
      Click Me
    </button>

    <p>
      Paragraph with an embedded <button>inline button</button> inside.
    </p>

    <script>
      // Runs automatically when the page loads
      console.log('Welcome to Lesson 4 Practice Page!');
    </script>
  </body>
</html>
