<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>

    <!-- Rock Button -->
    <button onclick="
      randomNumber = Math.random();

      if (randomNumber >= 0 && randomNumber < 1/3){
        computerMove = 'rock';
      } else if (randomNumber >= 1/3 && randomNumber < 2/3){
        computerMove = 'paper';
      } else {
        computerMove = 'scissors';
      }

      if (computerMove === 'rock'){
        result = 'Tie.';
      } else if (computerMove === 'paper'){
        result = 'You lose.'
      } else if (computerMove === 'scissors'){
        result = 'You win.'
      }

      alert(`You picked rock. Computer picked ${computerMove}. ${result}`);
    ">
      Rock
    </button>
    
    <!-- Paper Button -->
    <button onclick="
      randomNumber = Math.random();

      if (randomNumber >= 0 && randomNumber < 1/3){
        computerMove = 'rock';
      } else if (randomNumber >= 1/3 && randomNumber < 2/3){
        computerMove = 'paper';
      } else {
        computerMove = 'scissors';
      }

      if (computerMove === 'rock'){
        result = 'You win.';
      } else if (computerMove === 'paper'){
        result = 'Tie.'
      } else if (computerMove === 'scissors'){
        result = 'You lose.'
      }

      alert(`You picked paper. Computer picked ${computerMove}. ${result}`);
    ">
      Paper
    </button>
    
    <button onclick="
      randomNumber = Math.random();

      if (randomNumber >= 0 && randomNumber < 1/3){
        computerMove = 'rock';
      } else if (randomNumber >= 1/3 && randomNumber < 2/3){
        computerMove = 'paper';
      } else {
        computerMove = 'scissors';
      }

      if (computerMove === 'rock'){
        result = 'You lose.';
      } else if (computerMove === 'paper'){
        result = 'You win.'
      } else if (computerMove === 'scissors'){
        result = 'Tie.'
      }

      alert(`You picked scissors. Computer picked ${computerMove}. ${result}`);
    ">
      Scissors
    </button>
    <script>
      // Declare variables globally so inline onclick events can safely reuse them without reclaration errors
      let randomNumber = 0;
      let computerMove = '';
      let result = '';
    </script>
  </body>
</html>
