<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors (Advanced Functions Version)</title>
    <link rel="stylesheet" href="styles/12-rock-paper-scissors.css">
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>

    <!-- Player Move Buttons -->
    <button class="move-button js-rock-button">
      <img src="../images/rock-emoji.png" class="move-icon">
    </button>
    
    <button class="move-button js-paper-button">
      <img src="../images/paper-emoji.png" class="move-icon">
    </button>
    
    <button class="move-button js-scissors-button">
      <img src="../images/scissors-emoji.png" class="move-icon">
    </button>

    <!-- Dynamic DOM Outcome Displays -->
    <p class="js-result result"></p>
    <p class="js-moves moves"></p>
    <p class="js-score score"></p>

    <!-- Controls -->
    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
      updateScoreElement();
      document.querySelector('.js-result').innerHTML = '';
      document.querySelector('.js-moves').innerHTML = '';
    " class="reset-score-button">
      Reset Score
    </button>

    <button onclick="autoPlayToggle();" class="js-auto-play auto-play-button">
      Auto Play
    </button>

    <script src="scripts/12-rock-paper-scissors.js"></script>
  </body>
</html>
