<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors (DOM & CSS Version)</title>
    <!-- Linking external stylesheet -->
    <link rel="stylesheet" href="styles/10-rock-paper-scissors.css">
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>

    <!-- Player Move Buttons with Emoji Images -->
    <button class="move-button" onclick="playGame('rock');">
      <img src="../images/rock-emoji.png" class="move-icon">
    </button>
    
    <button class="move-button" onclick="playGame('paper');">
      <img src="../images/paper-emoji.png" class="move-icon">
    </button>
    
    <button class="move-button" onclick="playGame('scissors');">
      <img src="../images/scissors-emoji.png" class="move-icon">
    </button>

    <!-- Dynamic DOM Display Paragraphs -->
    <p class="js-result result"></p>
    <p class="js-moves moves"></p>
    <p class="js-score score"></p>

    <!-- Reset Score Button -->
    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      
      localStorage.removeItem('score');
      updateScoreElement();
      
      // Clear outcome displays upon score reset
      document.querySelector('.js-result').innerHTML = '';
      document.querySelector('.js-moves').innerHTML = '';
    " class="reset-score-button">
      Reset Score
    </button>

    <!-- Linking external JavaScript file -->
    <script src="scripts/10-rock-paper-scissors.js"></script>
  </body>
</html>
