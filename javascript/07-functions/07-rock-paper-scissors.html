<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors (Functions Version)</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>

    <!-- Rock Button -->
    <button onclick="
      playGame('rock');
    ">
      Rock
    </button>
    
    <!-- Paper Button -->
    <button onclick="
      playGame('paper');
    ">
      Paper
    </button>
    
    <!-- Scissors Button -->
    <button onclick="
      playGame('scissors');
    ">
      Scissors
    </button>

    <script>
      // Function to handle the core game logic
      function playGame(playerMove) {
        const computerMove = pickComputerMove();
        let result = '';

        if (playerMove === 'scissors') {
          if (computerMove === 'rock') {
            result = 'You lose.';
          } else if (computerMove === 'paper') {
            result = 'You win.';
          } else if (computerMove === 'scissors') {
            result = 'Tie.';
          }
        } else if (playerMove === 'rock') {
          if (computerMove === 'rock') {
            result = 'Tie.';
          } else if (computerMove === 'paper') {
            result = 'You lose.';
          } else if (computerMove === 'scissors') {
            result = 'You win.';
          }
        } else if (playerMove === 'paper') {
          if (computerMove === 'rock') {
            result = 'You win.';
          } else if (computerMove === 'paper') {
            result = 'Tie.';
          } else if (computerMove === 'scissors') {
            result = 'You lose.';
          }
        }

        alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}`);
      }

      // Helper function to randomly pick computer move and return it
      function pickComputerMove() {
        const randomNumber = Math.random();
        let computerMove = '';

        if (randomNumber >= 0 && randomNumber < 1/3) {
          computerMove = 'rock';
        } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
          computerMove = 'paper';
        } else {
          computerMove = 'scissors';
        }

        return computerMove;
      }
    </script>
  </body>
</html>
