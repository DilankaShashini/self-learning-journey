<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 11 Part 1 Exercises (11a - 11n)</title>
  </head>
  <body>
    <script>
      // ==========================================
      // 11a. Modify last array value
      // ==========================================
      const nums = [10, 20, 30];
      nums[nums.length - 1] = 99;
      console.log('11a:', nums); // [10, 20, 99]

      // ==========================================
      // 11b. Function getLastValue(array)
      // ==========================================
      function getLastValue(array) {
        const lastIndex = array.length - 1;
        return array[lastIndex];
      }
      console.log('11b ([1, 20, 22, 24, 5]):', getLastValue([1, 20, 22, 24, 5])); // 5
      console.log("11b (['hi', 'hello', 'good']):", getLastValue(['hi', 'hello', 'good'])); // 'good'

      // ==========================================
      // 11c. Function arraySwap(array)
      // ==========================================
      function arraySwap(array) {
        const lastIndex = array.length - 1;
        
        // Store first value in a temporary variable before swapping
        const firstValue = array[0];
        const lastValue = array[lastIndex];

        array[0] = lastValue;
        array[lastIndex] = firstValue;

        return array;
      }
      console.log('11c ([1, 20, 22, 24, 5]):', arraySwap([1, 20, 22, 24, 5])); // [5, 20, 22, 24, 1]
      console.log("11c (['hi', 'hello', 'good']):", arraySwap(['hi', 'hello', 'good'])); // ['good', 'hello', 'hi']

      // ==========================================
      // 11d & 11e. For Loops (Count up by 2 & Count down)
      // ==========================================
      console.log('11d (For Loop: Count up by 2):');
      for (let i = 0; i <= 10; i += 2) {
        console.log(i); // 0, 2, 4, 6, 8, 10
      }

      console.log('11e (For Loop: Count down 5 to 0):');
      for (let i = 5; i >= 0; i--) {
        console.log(i); // 5, 4, 3, 2, 1, 0
      }

      // ==========================================
      // 11f. Exercises 11d & 11e using While Loops
      // ==========================================
      console.log('11f (While Loop: Count up by 2):');
      let countUp = 0;
      while (countUp <= 10) {
        console.log(countUp);
        countUp += 2;
      }

      console.log('11f (While Loop: Count down 5 to 0):');
      let countDown = 5;
      while (countDown >= 0) {
        console.log(countDown);
        countDown--;
      }

      // ==========================================
      // 11g & 11h. Loop / Function addOne(array)
      // ==========================================
      function addOne(array) {
        const result = [];
        for (let i = 0; i < array.length; i++) {
          result.push(array[i] + 1);
        }
        return result;
      }
      console.log('11g/11h ([1, 2, 3]):', addOne([1, 2, 3])); // [2, 3, 4]
      console.log('11h ([-2, -1, 0, 99]):', addOne([-2, -1, 0, 99])); // [-1, 0, 1, 100]

      // ==========================================
      // 11i. Function addNum(array, num)
      // ==========================================
      function addNum(array, num) {
        const result = [];
        for (let i = 0; i < array.length; i++) {
          result.push(array[i] + num);
        }
        return result;
      }
      console.log('11i ([1, 2, 3], 2):', addNum([1, 2, 3], 2)); // [3, 4, 5]
      console.log('11i ([-2, -1, 0, 99], 2):', addNum([-2, -1, 0, 99], 2)); // [0, 1, 2, 101]

      // ==========================================
      // 11j. Function addArrays(array1, array2)
      // ==========================================
      function addArrays(array1, array2) {
        const result = [];
        for (let i = 0; i < array1.length; i++) {
          result.push(array1[i] + array2[i]);
        }
        return result;
      }
      console.log('11j ([1, 1, 2], [1, 1, 3]):', addArrays([1, 1, 2], [1, 1, 3])); // [2, 2, 5]
      console.log('11j ([1, 2, 3], [4, 5, 6]):', addArrays([1, 2, 3], [4, 5, 6])); // [5, 7, 9]

      // ==========================================
      // 11k. Function countPositive(nums)
      // ==========================================
      function countPositive(nums) {
        let positiveCount = 0;
        for (let i = 0; i < nums.length; i++) {
          if (nums[i] > 0) {
            positiveCount++;
          }
        }
        return positiveCount;
      }
      console.log('11k ([1, -3, 5]):', countPositive([1, -3, 5])); // 2
      console.log('11k ([-2, 3, -5, 7, 10]):', countPositive([-2, 3, -5, 7, 10])); // 3

      // ==========================================
      // 11l & 11m. Challenge: minMax(nums) with Edge Cases
      // ==========================================
      function minMax(nums) {
        // 11m: Edge case for empty array
        const result = {
          min: nums.length === 0 ? null : nums[0],
          max: nums.length === 0 ? null : nums[0]
        };

        for (let i = 0; i < nums.length; i++) {
          const value = nums[i];

          if (value < result.min) {
            result.min = value;
          }

          if (value > result.max) {
            result.max = value;
          }
        }

        return result;
      }
      console.log('11l ([1, -3, 5]):', minMax([1, -3, 5])); // { min: -3, max: 5 }
      console.log('11m ([]):', minMax([])); // { min: null, max: null }
      console.log('11m ([3]):', minMax([3])); // { min: 3, max: 3 }

      // ==========================================
      // 11n. Challenge: countWords(words) using Accumulator Object
      // ==========================================
      function countWords(words) {
        const result = {};

        for (let i = 0; i < words.length; i++) {
          const word = words[i];

          // If word property does not exist in result object, initialize with 1; else increment count
          if (!result[word]) {
            result[word] = 1;
          } else {
            result[word]++;
          }
        }

        return result;
      }
      console.log("11n (['apple', 'grape', 'apple', 'apple']):", countWords(['apple', 'grape', 'apple', 'apple']));
      // Output: { apple: 3, grape: 1 }
    </script>
  </body>
</html>
