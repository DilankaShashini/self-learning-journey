<!DOCTYPE html>
<html>
  <head>
    <title>Enhanced Cart Quantity</title>
  </head>
  <body>
    <!-- Display Cart Quantity -->
    <button onclick="console.log(`Cart Quantity: ${cartQuantity}`);">
      Show Quantity
    </button>

    <br><br>

    <!-- Increase Buttons with Max Limit Check (6k) -->
    <button onclick="
      if (cartQuantity + 1 > 10) alert('The cart is full');
      else {
        cartQuantity++;
        console.log(`Cart Quantity: ${cartQuantity}`);
      }
    ">
      Add to Cart
    </button>

    <button onclick="
      if (cartQuantity + 2 > 10) alert('The cart is full');
      else {
        cartQuantity += 2;
        console.log(`Cart Quantity: ${cartQuantity}`);
      }
    ">
      +2
    </button>

    <button onclick="
      if (cartQuantity + 3 > 10) alert('The cart is full');
      else {
        cartQuantity += 3;
        console.log(`Cart Quantity: ${cartQuantity}`);
      }
    ">
      +3
    </button>

    <button onclick="
      if (cartQuantity + 4 > 10) alert('The cart is full');
      else {
        cartQuantity += 4;
        console.log(`Cart Quantity: ${cartQuantity}`);
      }
    ">
      +4
    </button>

    <button onclick="
      if (cartQuantity + 5 > 10) alert('The cart is full');
      else {
        cartQuantity += 5;
        console.log(`Cart Quantity: ${cartQuantity}`);
      }
    ">
      +5
    </button>

    <br><br>

    <!-- Decrease Buttons with Minimum Limit Check (6l) -->
    <button onclick="
      if (cartQuantity - 1 < 0) alert('Not enough items in the cart');
      else {
        cartQuantity--;
        console.log(`Cart Quantity: ${cartQuantity}`);
      }
    ">
      Remove from cart
    </button>

    <button onclick="
      if (cartQuantity - 2 < 0) alert('Not enough items in the cart');
      else {
        cartQuantity -= 2;
        console.log(`Cart Quantity: ${cartQuantity}`);
      }
    ">
      -2
    </button>

    <button onclick="
      if (cartQuantity - 3 < 0) alert('Not enough items in the cart');
      else {
        cartQuantity -= 3;
        console.log(`Cart Quantity: ${cartQuantity}`);
      }
    ">
      -3  
    </button>

    <br><br>

    <!-- Reset Cart -->
    <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset');
      console.log(`Cart Quantity: ${cartQuantity}`);
    ">
      Reset Cart
    </button> 

    <script>
      let cartQuantity = 0;
    </script>
  </body>
</html>
