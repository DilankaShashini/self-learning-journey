<!DOCTYPE html>
<html>
  <head>
    <title>Variables Practice</title>
  </head>
  <body>
    <script>
      // 1. Variables Declaration & Usage
      let variable1 = 3;
      console.log('variable1:', variable1);

      let result = variable1 + 2;
      consol.log('result:', result);

      let message = 'hello';
      console.log('message:', message);

      // 2. Re-assigning Variables
      variable1 = 5;
      console.log('re-assigned variable1:', variable1);

      // 3. const vs let vs var
      const fixedValue = 10; // Cannot be reassigned
      let changeableValue = 20;
      changeableValue += 5;
      
      console.log('typeof fixedValue:', typeof fixedValue);
      console.log('typeof message:', typeof message);
    </script>
  </body>
</html>
