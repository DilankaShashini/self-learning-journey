<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 10c</title>
  </head>
  <body>
    <button class="js-button">Test</button>

    <script>
      // Query the button element from the DOM
      const buttonElement = document.querySelector('.js-button');

      // Check if the element contains the class 'js-button' and log result
      const hasClass = buttonElement.classList.contains('js-button');
      console.log(hasClass); // Outputs: true
    </script>
  </body>
</html>
