<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 11x - Persistent Todo List</title>
    <link rel="stylesheet" href="styles/exercise-11x.css">
  </head>
  <body>
    <p>Todo List (With LocalStorage)</p>

    <!-- CSS Grid Input Section -->
    <div class="todo-input-grid">
      <input 
        placeholder="Todo name"
        class="js-input-name input-name"
      >
      <input
        type="date"
        class="js-input-date input-date"
      >
      <button 
        class="js-add-button add-button"       
        onclick="addToList();"
      >
        Add
      </button>
    </div>

    <!-- Dynamic Container for generated todo list HTML -->
    <div class="js-todo-list todo-list"></div>

    <script src="scripts/exercise-11x.js"></script>
  </body>
</html>
