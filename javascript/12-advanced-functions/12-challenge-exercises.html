<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors - Challenge Exercises (12r - 12x)</title>
    <link rel="stylesheet" href="styles/12-challenge-exercises.css">
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>

    <!-- Player Move Buttons -->
    <button class="move-button js-rock-button">
      <img src="../images/rock-emoji.png" class="move-icon">
    </button>

    <button class="move-button js-paper-button">
      <img src="../images/paper-emoji.png" class="move-icon">
    </button>

    <button class="move-button js-scissors-button">
      <img src="../images/scissors-emoji.png" class="move-icon">
    </button>

    <!-- Dynamic DOM Display Paragraphs -->
    <p class="js-result result"></p>
    <p class="js-moves moves"></p>
    <p class="js-score score"></p>

    <!-- Reset & Auto Play Controls -->
    <button class="reset-score-button js-reset-score-button">Reset Score</button>
    <button class="auto-play-button js-auto-play-button">Auto Play</button>

    <!-- 12x: Confirmation Message Overlay Container -->
    <div class="js-reset-confirmation reset-confirmation-container"></div>

    <script src="scripts/12-challenge-exercises.js"></script>
  </body>
</html>
