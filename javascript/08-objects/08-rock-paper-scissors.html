<!DOCTYPE html> 
<html>
  <head>
    <title>Rock Paper Scissors (Objects & LocalStorage)</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>

    <!-- Player Move Buttons -->
    <button onclick="playGame('rock');">Rock</button>
    <button onclick="playGame('paper');">Paper</button>
    <button onclick="playGame('scissors');">Scissors</button>

    <!-- Reset Score Button -->
    <button onclick="
      // 1. Reset the runtime 'score' boject in RAM so current session stays updated immediately
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      
      // 2. Clear stored 'score' from localStorage to ensure persistence is reset 
      localStorage.removeItem('score');

      // Optional notification
      alert('Score has been reset!');
    ">
      Reset Score
    </button>

    <script>
      // Load saved score from localStorage using deafult value pattern (|| operator)
      let score = JSON.parse(localStorage.getItem('score')) || {
        wins: 0,
        losses: 0,
        ties: 0
      };

      // Main Game Logic Function
      function playGame(playerMove) {
        const computerMove = pickComputerMove();
        let result = '';

        if (playerMove === 'scissors') {
          if (computerMove === 'rock') {
            result = 'You lose.';
          } else if (computerMove === 'paper') {
            result = 'You win.';
          } else if (computerMove === 'scissors') {
            result = 'Tie.';
          }
        } else if (playerMove === 'rock') {
          if (computerMove === 'rock') {
            result = 'Tie.';
          } else if (computerMove === 'paper') {
            result = 'You lose.';
          } else if (computerMove === 'scissors') {
            result = 'You win.';
          }
        } else if (playerMove === 'paper') {
          if (computerMove === 'rock') {
            result = 'You win.';
          } else if (computerMove === 'paper') {
            result = 'Tie.';
          } else if (computerMove === 'scissors') {
            result = 'You lose.';
          }
        }

        // Update score count inside the score object
        if (result === 'You win.') {
          score.wins += 1;
        } else if (result === 'You lose.') {
          score.losses += 1;
        } else if (result === 'Tie.') {
          score.ties += 1;
        }

        // Persist score to localStorage as a JSON string
        localStorage.setItem('score', JSON.stringify(score));

        // Display outcome and score summary
        alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
      }

      // Helper function to randomly pick computer move and return it
      function pickComputerMove() {
        const randomNumber = Math.random();
        let computerMove = '';

        if (randomNumber >= 0 && randomNumber < 1/3) {
          computerMove = 'rock';
        } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
          computerMove = 'paper';
        } else {
          computerMove = 'scissors';
        }

        return computerMove;
      }
    </script>
  </body>
</html>
